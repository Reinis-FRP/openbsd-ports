[build]
jobs = ${MAKE_JOBS}
build = "x86_64-unknown-openbsd"
host = ["x86_64-unknown-openbsd"]
target = ["x86_64-unknown-openbsd", "sbpf-solana-solana", "sbpfv1-solana-solana", "sbpfv2-solana-solana", "sbpfv3-solana-solana"]
cargo = "${WRKDIR}/rust-bootstrap-1.94.0/bin/cargo"
rustc = "${WRKDIR}/rust-bootstrap-1.94.0/bin/rustc"
docs = false
submodules = false
vendor = true
locked-deps = true

[llvm]
download-ci-llvm = false
ninja = true
targets = "X86"
experimental-targets = "BPF;SBF"
link-jobs = 2
link-shared = false
static-libstdcpp = false
clang = true
enable-projects = "lld"
cxxflags = "-fno-ret-protector -mno-retpoline"

[llvm.build-config]
LLVM_ENABLE_ZSTD = "OFF"
LLVM_ENABLE_TERMINFO = "OFF"

[rust]
download-rustc = false
channel = "dev"
lld = true
rpath = true
deny-warnings = false
debug = false
debuginfo-level = 0
codegen-tests = false
